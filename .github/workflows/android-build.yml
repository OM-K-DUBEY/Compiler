
name: DevForge AI - Android APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    name: Build DevForge AI
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      - name: Check project configuration
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f gradle/libs.versions.toml
          test -f gradle/wrapper/gradle-wrapper.properties
          echo "Project structure verified"

      - name: Generate temporary debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Check Gradle installation
        run: gradle --version

      - name: Build Debug APK
        id: build
        run: |
          gradle --no-daemon --stacktrace \
            :app:assembleDebug

      - name: Run unit tests
        continue-on-error: true
        run: |
          gradle --no-daemon \
            :app:testDebugUnitTest

      - name: Upload APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: DevForgeAI-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DevForgeAI-Test-Reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
